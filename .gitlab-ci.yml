stages:
  - build
  - deploy

variables:
  DOTNET_VERSION: '9.0.x'
  RESOURCE_GROUP: 'TradingDashboard-RG'
  API_COT_APP_NAME: 'td-api-cot'
  API_LOGIN_APP_NAME: 'td-api-login'
  BLAZOR_APP_NAME: 'td-blazor-ui'

#########################################
################# Build #################
#########################################

# Build COT API
build-api-cot:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - apt-get update && apt-get install -y zip
    - cd src/Features/Cot/TradingDashboard.Features.Cot.Presentation.Api
    - dotnet restore
    - dotnet build -c Release --no-restore
    - dotnet publish -c Release -o ./publish --no-build
    - cd publish && zip -r ../api-cot.zip .
  artifacts:
    paths:
      - src/Features/Cot/TradingDashboard.Features.Cot.Presentation.Api/api-cot.zip
    expire_in: 1 hour
  only:
    - master

# Build Login API
build-api-login:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - apt-get update && apt-get install -y zip
    - cd src/Features/Login/TradingDashboard.Features.Login.Presentation.Api
    - dotnet restore
    - dotnet build -c Release --no-restore
    - dotnet publish -c Release -o ./publish --no-build
    - cd publish && zip -r ../api-login.zip .
  artifacts:
    paths:
      - src/Features/Login/TradingDashboard.Features.Login.Presentation.Api/api-login.zip
    expire_in: 1 hour
  only:
    - master

# Build Client Dashboard
build-client-dashboard:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - apt-get update && apt-get install -y zip
    - cd src/Presentation/TradingDashboard.Presentation.Blazor
    - dotnet restore
    - dotnet build -c Release --no-restore
    - dotnet publish -c Release -o ./publish --no-build
    - cd publish && zip -r ../blazor.zip .
  artifacts:
    paths:
      - src/Presentation/TradingDashboard.Presentation.Blazor/blazor.zip
    expire_in: 1 hour
  only:
    - master




#########################################
################# Deply #################
#########################################
# Deploy COT API to Azure
deploy-api-cot:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  dependencies:
    - build-api-cot
  script:
    - az login --service-principal --username $AZURE_CLIENT_ID --password $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az webapp deploy --resource-group $RESOURCE_GROUP --name $API_COT_APP_NAME --src-path src/Features/Cot/TradingDashboard.Features.Cot.Presentation.Api/api-cot.zip --type zip
  only:
    - master
  needs:
    - build-api-cot
  environment:
    name: production-api
    url: https://td-api-cot-ejenhygxhtewasb2.westeurope-01.azurewebsites.net



# Deploy Login API to Azure
deploy-api-login:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  dependencies:
    - build-api-login
  script:
    - az login --service-principal --username $AZURE_CLIENT_ID --password $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az webapp deploy --resource-group $RESOURCE_GROUP --name $API_LOGIN_APP_NAME --src-path src/Features/Login/TradingDashboard.Features.Login.Presentation.Api/api-login.zip --type zip
  only:
    - master
  needs:
    - build-api-login
  environment:
    name: production-api-login
    url: https://td-api-login-fagqhrd4gacyhvf2.westeurope-01.azurewebsites.net

# Deploy Blazor to Azure
deploy-client-dashboard:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  dependencies:
    - build-client-dashboard
  script:
    - az login --service-principal --username $AZURE_CLIENT_ID --password $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az webapp deploy --resource-group $RESOURCE_GROUP --name $BLAZOR_APP_NAME --src-path src/Presentation/TradingDashboard.Presentation.Blazor/blazor.zip --type zip
  only:
    - master
  needs:
    - build-client-dashboard
  environment:
    name: production-blazor
    url: https://td-blazor-ui.azurewebsites.net


stages:
  - test
  - build
  - deploy

variables:
  DOTNET_VERSION: "9.0"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

default:
  interruptible: true

unit-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - dotnet restore test/TradingDashboard.UnitTests/TradingDashboard.UnitTests.csproj
    - dotnet test test/TradingDashboard.UnitTests/TradingDashboard.UnitTests.csproj -c Release --no-restore
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

build-release:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:9.0
  script:
    - apt-get update && apt-get install -y zip
    # Restoring the whole solution pulls in the MAUI host, which needs workloads
    # that are not installed in this Linux runner. Restore only deployable projects.
    - dotnet restore src/Features/Cot/TradingDashboard.Features.Cot.CollectService/TradingDashboard.Features.Cot.CollectService.csproj
    - dotnet restore src/Features/Cot/TradingDashboard.Features.Cot.Presentation.Api/TradingDashboard.Features.Cot.Presentation.Api.csproj
    - dotnet restore src/Features/Login/TradingDashboard.Features.Login.Presentation.Api/TradingDashboard.Features.Login.Presentation.Api.csproj
    - dotnet restore src/Presentation/TradingDashboard.Presentation.Blazor/TradingDashboard.Presentation.Blazor.csproj
    - dotnet publish src/Features/Cot/TradingDashboard.Features.Cot.CollectService/TradingDashboard.Features.Cot.CollectService.csproj -c Release -o out/cot-collect --no-restore
    - dotnet publish src/Features/Cot/TradingDashboard.Features.Cot.Presentation.Api/TradingDashboard.Features.Cot.Presentation.Api.csproj -c Release -o out/cot --no-restore
    - dotnet publish src/Features/Login/TradingDashboard.Features.Login.Presentation.Api/TradingDashboard.Features.Login.Presentation.Api.csproj -c Release -o out/login --no-restore
    - dotnet publish src/Presentation/TradingDashboard.Presentation.Blazor/TradingDashboard.Presentation.Blazor.csproj -c Release -o out/blazor --no-restore
    - (cd out/cot-collect && zip -r ../cot-collect.zip .)
    - (cd out/cot && zip -r ../cot.zip .)
    - (cd out/login && zip -r ../login.zip .)
    - (cd out/blazor && zip -r ../blazor.zip .)
  artifacts:
    name: "terminalprime-release-$CI_COMMIT_SHORT_SHA"
    paths:
      - out/cot-collect.zip
      - out/cot.zip
      - out/login.zip
      - out/blazor.zip
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

deploy-production:
  stage: deploy
  image: alpine:3.20
  needs:
    - build-release
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
  script:
    - scp out/cot-collect.zip "$VPS_USER@$VPS_HOST:/tmp/terminalprime-cot-collect.zip"
    - scp out/cot.zip "$VPS_USER@$VPS_HOST:/tmp/terminalprime-cot.zip"
    - scp out/login.zip "$VPS_USER@$VPS_HOST:/tmp/terminalprime-login.zip"
    - scp out/blazor.zip "$VPS_USER@$VPS_HOST:/tmp/terminalprime-blazor.zip"
    - |
      ssh "$VPS_USER@$VPS_HOST" '
      set -e
      sudo systemctl stop terminalprime-cot-collect || true
      sudo systemctl stop terminalprime-cot
      sudo systemctl stop terminalprime-login
      sudo systemctl stop terminalprime-blazor
      sudo mkdir -p /var/www/terminalprime/cot-collect
      sudo rm -rf /var/www/terminalprime/cot-collect/*
      sudo rm -rf /var/www/terminalprime/cot/*
      sudo rm -rf /var/www/terminalprime/login/*
      sudo rm -rf /var/www/terminalprime/blazor/*
      sudo unzip -oq /tmp/terminalprime-cot-collect.zip -d /var/www/terminalprime/cot-collect
      sudo unzip -oq /tmp/terminalprime-cot.zip -d /var/www/terminalprime/cot
      sudo unzip -oq /tmp/terminalprime-login.zip -d /var/www/terminalprime/login
      sudo unzip -oq /tmp/terminalprime-blazor.zip -d /var/www/terminalprime/blazor
      sudo chown -R terminalprime:terminalprime /var/www/terminalprime
      sudo systemctl start terminalprime-cot-collect
      sudo systemctl start terminalprime-cot
      sudo systemctl start terminalprime-login
      sudo systemctl start terminalprime-blazor
      sudo systemctl --no-pager --full status terminalprime-cot-collect
      sudo systemctl --no-pager --full status terminalprime-cot
      sudo systemctl --no-pager --full status terminalprime-login
      sudo systemctl --no-pager --full status terminalprime-blazor
      rm -f /tmp/terminalprime-cot-collect.zip /tmp/terminalprime-cot.zip /tmp/terminalprime-login.zip /tmp/terminalprime-blazor.zip
      '
  environment:
    name: production
    url: https://terminalprime.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

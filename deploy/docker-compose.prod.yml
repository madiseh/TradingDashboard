services:
  nginx:
    image: nginx:1.27-alpine
    container_name: terminalprime-nginx
    depends_on:
      - blazor
      - api-cot
      - api-login
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/terminalprime.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped

  blazor:
    image: ${BLAZOR_IMAGE}
    container_name: terminalprime-blazor
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiCot__BaseUrl: https://api-cot.terminalprime.com
      ApiLogin__BaseUrl: https://api-login.terminalprime.com
    expose:
      - "8080"
    restart: unless-stopped

  api-cot:
    image: ${API_COT_IMAGE}
    container_name: terminalprime-api-cot
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CotDatabase: ${COT_DATABASE_CONNECTION}
      RedisSync__IntervalSeconds: ${REDIS_SYNC_INTERVAL_SECONDS:-60}
    expose:
      - "8080"
    restart: unless-stopped

  api-login:
    image: ${API_LOGIN_IMAGE}
    container_name: terminalprime-api-login
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__LoginDatabase: ${LOGIN_DATABASE_CONNECTION}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_LIFETIME_MINUTES:-60}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET}
    expose:
      - "8080"
    restart: unless-stopped

